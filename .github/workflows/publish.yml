name: Publish to npm

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write # push the release tag and create the GitHub Release
  id-token: write # signs the npm provenance statement

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false # never let two releases race onto the registry

jobs:
  publish:
    # A manual run from any other branch must not be able to release.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Dependency lifecycle scripts are an arbitrary-code-execution path during install.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Publishing a version that already exists is a hard error, so a commit that does not
      # bump the version skips the release instead of failing it.
      - name: Decide whether this version needs publishing
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is new; releasing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # The CHANGELOG section becomes the GitHub Release note; a release without one stops here,
      # before anything reaches the registry.
      - name: Read the release notes from CHANGELOG.md
        if: steps.check.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[.+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release-notes.md"; then
            echo "CHANGELOG.md has no section for $VERSION." >&2
            exit 1
          fi

      - name: Lint
        if: steps.check.outputs.publish == 'true'
        run: npm run lint

      - name: Type-check
        if: steps.check.outputs.publish == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: npm test

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Size budget
        if: steps.check.outputs.publish == 'true'
        run: npm run size

      - name: Lint the package
        if: steps.check.outputs.publish == 'true'
        run: npm run lint:package

      # The tests measure the source; this measures the tarball a consumer installs.
      - name: Smoke test the packed tarball
        if: steps.check.outputs.publish == 'true'
        run: |
          npm pack
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE"/*.tgz

          cat > esm.mjs <<'EOF'
          import { deepClone, isDeepEqual } from "@handijit/utils";
          if (isDeepEqual(new URL("https://a.com"), new URL("https://b.com"))) {
            throw new Error("ESM entry is broken: isDeepEqual");
          }
          if (!(deepClone(new Map([["a", 1]])) instanceof Map)) {
            throw new Error("ESM entry is broken: deepClone");
          }
          console.log("ESM entry OK");
          EOF

          cat > cjs.cjs <<'EOF'
          const { deepClone, isDeepEqual } = require("@handijit/utils");
          if (isDeepEqual(new URL("https://a.com"), new URL("https://b.com"))) {
            throw new Error("CJS entry is broken: isDeepEqual");
          }
          if (!(deepClone(new Map([["a", 1]])) instanceof Map)) {
            throw new Error("CJS entry is broken: deepClone");
          }
          console.log("CJS entry OK");
          EOF

          node esm.mjs
          node cjs.cjs

      # prepublishOnly re-runs `npm run verify` here as the last gate.
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create the GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.publish }}" = "true" ]; then
            echo "Published ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Skipped: ${{ steps.check.outputs.name }}@${{ steps.check.outputs.version }} is already on npm. Bump the version in package.json to release." >> "$GITHUB_STEP_SUMMARY"
          fi
